<header class="mx-auto {{width|max-w-page}} px-6">
  <nav class="flex flex-wrap items-center justify-between gap-4 py-7">
    <a class="text-[15px] font-bold tracking-[-.02em]" href="/">orochi<span class="text-acid">braru</span></a>
    <div class="flex items-center gap-4 text-[13px] whitespace-nowrap text-dim sm:gap-5">
      <a class="hover:text-acid" href="/#projects">Projects</a>
      <a class="hover:text-acid" href="/blog">Blog</a>
      <a class="hover:text-acid" href="/about">About</a>
      <a class="hover:text-acid" href="{{source|https://github.com/orochibraru?tab=repositories}}" rel="noopener">{{sourceLabel|GitHub}}</a>
      <button id="search-open" type="button" aria-label="Search the site"
        class="flex items-center gap-2 border border-edge px-2.5 py-1.5 transition hover:border-acid hover:text-acid">
        <svg viewBox="0 0 24 24" class="size-3.5" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>
        </svg>
        <span class="hidden sm:inline">Search</span>
        <kbd class="hidden font-mono text-[11px] text-edge sm:inline">&#8984;K</kbd>
      </button>
      <button id="theme-toggle" type="button" aria-label="Theme: system. Switch to light."
        class="grid size-8 place-items-center border border-edge transition hover:border-acid hover:text-acid">
        <svg viewBox="0 0 24 24" class="theme-icon theme-system size-4" aria-hidden="true"
          fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
          <rect x="3" y="4" width="18" height="12.5" rx="1.5"/><path d="M9.5 20.5h5M12 16.5v4"/>
        </svg>
        <svg viewBox="0 0 24 24" class="theme-icon theme-light size-4" aria-hidden="true"
          fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
          <circle cx="12" cy="12" r="4.2"/>
          <path d="M12 2.7v2.1M12 19.2v2.1M21.3 12h-2.1M4.8 12H2.7M18.6 5.4 17.1 6.9M6.9 17.1 5.4 18.6M18.6 18.6 17.1 17.1M6.9 6.9 5.4 5.4"/>
        </svg>
        <svg viewBox="0 0 24 24" class="theme-icon theme-dark size-4" aria-hidden="true"
          fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round">
          <path d="M20.2 14.8A8.6 8.6 0 0 1 9.2 3.8a8.6 8.6 0 1 0 11 11Z"/>
        </svg>
      </button>
    </div>
  </nav>
</header>
