<!-- Home > {{name}}. Google renders this trail in place of the raw URL in results. -->
<script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "BreadcrumbList",
    "itemListElement": [
      { "@type": "ListItem", "position": 1, "name": "Home", "item": "https://orochibraru.com/" },
      {
        "@type": "ListItem",
        "position": 2,
        "name": "{{name}}",
        "item": "https://orochibraru.com{{path}}"
      }
    ]
  }
</script>
