default_install_hook_types: [pre-commit, commit-msg, post-checkout]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-merge-conflict

      - id: check-case-conflict

      - id: detect-private-key

      - id: check-yaml

      - id: mixed-line-ending
        args: [--fix=lf]
        # src/docs is vendored from the project repos and must stay byte-identical to upstream
        exclude: &generated ^(bun\.lock|src/docs/)
      - id: end-of-file-fixer
        exclude: *generated

      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
        exclude: *generated

  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.4.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: https://github.com/crate-ci/typos
    rev: v1.50.1
    hooks:
      - id: typos
        args: [--force-exclude]
        exclude: *generated

  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint

  - repo: https://github.com/hadolint/hadolint
    rev: v2.15.1
    hooks:
      - id: hadolint-docker

  - repo: local
    hooks:
      - id: biome
        name: biome check --write
        entry: bun run biome check --write --no-errors-on-unmatched --files-ignore-unknown=true
        language: system
        files: \.(ts|tsx|js|jsx|mjs|cjs|json|jsonc|css|svelte|html)$

      # tailwint needs app.css in the same run to resolve the project, so it gets the globs, not filenames
      - id: tailwint
        name: tailwint
        entry: bun run tailwint --fix 'src/**/*.{css,svelte}'
        language: system
        pass_filenames: false
        files: ^src/.*\.(css|svelte)$

      - id: svelte-check
        name: svelte-check
        entry: bun run check:app
        language: system
        pass_filenames: false
        files: (\.(ts|js|svelte)$|^(tsconfig\.json|svelte\.config\.js|package\.json)$)

      - id: prettier-md
        name: prettier (markdown)
        entry: bun run prettier --log-level warn --write
        language: system
        types: [markdown]
        exclude: *generated

      - id: markdownlint
        name: markdownlint-cli2 --fix
        entry: bun run markdownlint-cli2 --fix
        language: system
        types: [markdown]
        exclude: ^(src/docs/|\.claude/skills/)

      # node_modules and .svelte-kit aren't part of the checkout, so a branch switch leaves them stale
      - id: bun-install
        name: bun install
        entry: sh -c 'bun install --ignore-scripts && bun run svelte-kit sync'
        language: system
        stages: [post-checkout]
        always_run: true
        pass_filenames: false

  - repo: local
    hooks:
      - id: no-manual-route-typing
        name: "route files: no manual $props()/load/actions typing (./$types is inferred)"
        language: pygrep
        entry: |-
          (: (PageData|PageProps|LayoutData|ActionData|LayoutProps|PageServerLoad|LayoutServerLoad|Actions|RequestHandler)\b|from "\./\$types")
        files: ^src/routes/.*\.(ts|svelte)$

      - id: internal-links-resolve
        name: "internal links go through resolve() from $app/paths"
        language: pygrep
        entry: href="/
        files: ^src/.*\.svelte$
