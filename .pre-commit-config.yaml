default_install_hook_types: [pre-commit, commit-msg, pre-push, post-checkout]
default_stages: [pre-commit]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-merge-conflict
        name: Look for Merge Conflicts

      - id: check-case-conflict
        name: Look for case conflicts

      - id: check-yaml
        name: Validate Yaml

      - id: check-added-large-files
        name: Look for large files

      - id: mixed-line-ending
        name: Fix line endings
        args: [--fix=lf]
        # src/docs is vendored from the project repos and must stay byte-identical to upstream
        exclude: &generated |-
          (?x)^(
            src/docs/|
            static/docs-config\.schema\.json|
            drizzle/|
            bun\.lock
          )

      - id: end-of-file-fixer
        name: Fix end of files
        exclude: *generated

      - id: trailing-whitespace
        name: Fix trailing whitespaces
        args: [--markdown-linebreak-ext=md]
        exclude: *generated

  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.4.0
    hooks:
      - id: conventional-pre-commit
        name: Ensure conventional commits
        stages: [commit-msg]

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
        name: Look for hardcoded secrets

  - repo: https://github.com/crate-ci/typos
    rev: v1.50.1
    hooks:
      - id: typos
        name: Look for typos
        args: [--force-exclude]
        exclude: *generated

  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint
        name: Lint Github Actions

  - repo: https://github.com/hadolint/hadolint
    rev: v2.15.1
    hooks:
      - id: hadolint-docker
        name: Lint Docker

  - repo: local
    hooks:
      - id: biome
        name: Format and sort imports (Biome)
        entry: node_modules/.bin/biome check --write --error-on-warnings --no-errors-on-unmatched --files-ignore-unknown=true
        language: system
        require_serial: true
        files: \.(ts|tsx|js|jsx|mjs|cjs|json|jsonc|css|svelte|html)$

      - id: format-md
        name: Formatting (MD)
        entry: bun run prettier --log-level warn --write
        language: system
        files: \.(md|mdx)$
        exclude: *generated

      - id: markdownlint
        name: Markdown Lint
        entry: bun run markdownlint-cli2 --fix
        language: system
        types: [markdown]
        exclude: ^(src/docs/|\.claude/skills/)

      # tailwint needs app.css in the same run to resolve the project, so it gets the globs, not filenames
      - id: lint-tailwind
        name: Lint (Tailwind)
        entry: bun run tailwint --fix 'src/**/*.{css,svelte}'
        language: system
        require_serial: true
        pass_filenames: false
        files: ^src/.*\.(svelte|css)$

      - id: check
        name: Type Check
        entry: bun run check:app
        language: system
        pass_filenames: false
        stages: [pre-push]
        files: ^(src/|scripts/|tests/|svelte\.config\.js$|tsconfig.*\.json$|package\.json$)

      - id: test-unit
        name: Unit Tests
        entry: bun test
        language: system
        pass_filenames: false
        stages: [pre-push]
        files: ^(src/|tests/|drizzle/)

      # node_modules and .svelte-kit aren't part of the checkout, so a branch switch leaves them stale
      - id: bun-install
        name: Install dependencies
        entry: sh -c 'bun install --ignore-scripts && bun run svelte-kit sync'
        language: system
        stages: [post-checkout]
        always_run: true
        pass_filenames: false

  - repo: local
    hooks:
      - id: no-manual-route-typing
        name: "Look for injected inferred types in routes"
        language: pygrep
        entry: |-
          (: (PageData|PageProps|LayoutData|ActionData|LayoutProps|PageServerLoad|LayoutServerLoad|Actions|RequestHandler)\b|from "\./\$types")
        files: ^src/routes/.*\.(ts|svelte)$

      - id: no-raw-drizzle-in-routes
        name: "Make sure DTOs are used in routes, not drizzle directly"
        language: pygrep
        entry: \bdb\.(select|insert|update|delete)\(
        files: ^src/routes/.*\.ts$

      - id: internal-links-resolve
        name: "Make sure all paths are resolved"
        language: pygrep
        entry: href="/
        files: ^src/.*\.svelte$
