server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options SAMEORIGIN;
    add_header Referrer-Policy strict-origin-when-cross-origin;

    gzip on;
    gzip_types text/plain text/markdown text/css text/xml application/xml application/rss+xml image/svg+xml;

    location / {
        # one canonical URL per page: /index.html and /baba.html redirect to / and /baba.
        # $request_uri is the *original* request, so internal error_page redirects skip this.
        if ($request_uri ~ "^/index(\.html)?($|\?)")      { return 301 /; }
        if ($request_uri ~ "^/(.+)/index(\.html)?($|\?)") { return 301 /$1; }
        if ($request_uri ~ "^/(.+)\.html($|\?)")          { return 301 /$1; }
        if ($request_uri ~ "^/(.+)/($|\?)")                { return 301 /$1; }
        try_files $uri $uri.html $uri/index.html $uri/ =404;
    }

    location ~* \.(css|js|svg|png|jpg|webp|woff2)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location = /feed.xml { types { } default_type "application/rss+xml; charset=utf-8"; }

    # The Markdown twin of every page, plus the llms.txt index: read in the
    # browser, not downloaded, so a crawler that follows the link sees text.
    location ~* \.md$ { types { } default_type "text/markdown; charset=utf-8"; }
    location ~* ^/llms(-full)?\.txt$ { types { } default_type "text/plain; charset=utf-8"; }

    error_page 404 /404.html;
}
