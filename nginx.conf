server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Keep Location headers relative. This container only ever speaks http, so an
    # absolute redirect would hand crawlers http://orochibraru.com/... and cost an
    # extra hop back through the TLS proxy on every canonicalising 301 below.
    absolute_redirect off;

    # robots.txt and the Markdown twins are full of em dashes; without this they
    # are served as us-ascii and arrive as mojibake.
    charset utf-8;
    charset_types text/plain text/markdown text/xml text/css application/javascript application/rss+xml image/svg+xml;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_types text/plain text/markdown text/css text/xml application/javascript application/json application/xml application/rss+xml application/atom+xml image/svg+xml;

    location / {
        # one canonical URL per page: /index.html and /baba.html redirect to / and /baba.
        # $request_uri is the *original* request, so internal error_page redirects skip this.
        if ($request_uri ~ "^/index(\.html)?($|\?)")      { return 301 /; }
        if ($request_uri ~ "^/(.+)/index(\.html)?($|\?)") { return 301 /$1; }
        if ($request_uri ~ "^/(.+)\.html($|\?)")          { return 301 /$1; }
        if ($request_uri ~ "^/(.+)/($|\?)")                { return 301 /$1; }
        try_files $uri $uri.html $uri/index.html $uri/ =404;
    }

    location ~* \.(css|js|svg|png|jpg|webp|woff2)$ {
        # One Cache-Control, not expires + add_header, which emits two. add_header
        # in a location drops the server-level ones, so nosniff is repeated here.
        add_header Cache-Control "public, max-age=2592000, immutable" always;
        add_header X-Content-Type-Options nosniff always;
    }

    # Types nginx does not ship: RSS, and the Markdown twin of every page (read in
    # the browser, not downloaded, so a crawler that follows the link sees text).
    # These must be real `types` entries, not `default_type`: with default_type the
    # "; charset=..." rides along in the string gzip_types is matched against, so
    # nothing ever matches and llms-full.txt goes out as 200kB of plain text.
    location = /feed.xml { types { application/rss+xml xml; } }
    location ~* \.md$    { types { text/markdown md; } }

    error_page 404 /404.html;
}
