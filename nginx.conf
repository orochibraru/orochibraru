server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options SAMEORIGIN;
    add_header Referrer-Policy strict-origin-when-cross-origin;

    gzip on;
    gzip_types text/plain text/css application/xml image/svg+xml;

    location / {
        # one canonical URL per page: /index.html and /baba.html redirect to / and /baba.
        # $request_uri is the *original* request, so internal error_page redirects skip this.
        if ($request_uri ~ "^/index(\.html)?($|\?)") { return 301 /; }
        if ($request_uri ~ "^/(.+)\.html($|\?)")     { return 301 /$1; }
        try_files $uri $uri.html $uri/ =404;
    }

    location ~* \.(css|svg|png|jpg|webp|woff2)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    error_page 404 /404.html;
}
