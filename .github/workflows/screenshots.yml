name: Refresh screenshots

# The Penombre gallery is generated by Playwright in that repo and published with
# its docs. The site vendors it so pages stay self-contained and light; this pulls
# whatever is current, re-encodes it, and commits the result only if something
# actually moved. Run it by hand from the Actions tab whenever the UI changes.
on:
  schedule:
    - cron: "17 4 * * *" # daily, off the hour: those minutes are stampedes
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-screenshots
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2

      - name: Install cwebp
        run: sudo apt-get update && sudo apt-get install -y webp

      # --ignore-scripts: `prepare` installs the prek hooks, which CI has no use for
      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Refetch the gallery
        run: bun run screenshots

      - name: Rebuild, so a bad shot fails here and not in production
        run: bun run build

      - name: Commit anything that moved
        run: |
          if git diff --quiet -- src/screenshots; then
            echo "gallery unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/screenshots
          git commit -m "chore: refresh penombre screenshots"
          git push
