name: prek

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: prek-${{ github.ref }}
  # never cancel a release halfway through (image pushed, tag not)
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  prek:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2

      # the local hooks (biome, tailwint, svelte-check, prettier, markdownlint) run from node_modules
      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - uses: j178/prek-action@v3.0.0

  release:
    needs: prek
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      # the release commit goes over SSH with a deploy key: the main ruleset lets deploy keys bypass it
      - uses: actions/checkout@v7
        with:
          ssh-key: ${{ secrets.RELEASE_DEPLOY_KEY }}
      - uses: orochibraru/releaser@v1
        with:
          docker: true
