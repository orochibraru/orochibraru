name: prek

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: prek-${{ github.ref }}
  # never cancel a release halfway through (image pushed, tag not)
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  prek:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      # the local hooks (biome, tailwint, svelte-check, prettier, markdownlint) run from node_modules
      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - uses: j178/prek-action@4e14d07f9231acabce116ccfca13b13dd9755ece # v3.0.0
        # pinact resolves tags over the GitHub API; unauthenticated runner IPs get rate limited
        env:
          GITHUB_TOKEN: ${{ github.token }}

  release:
    needs: prek
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      # the release commit goes over SSH with a deploy key: the main ruleset lets deploy keys bypass it
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ssh-key: ${{ secrets.RELEASE_DEPLOY_KEY }}
      - uses: orochibraru/releaser@8dbfc26574b8220c704f9d9640672b76fd92f2d2 # v1.3.0
        with:
          docker: true
