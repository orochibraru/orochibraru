name: Refresh docs

# Each project's docs/*.md is the source of truth; this site is where it gets
# published. This pulls whatever those repos currently have — guides and the
# screenshots beside them — re-encodes the images, and commits the result only
# if something actually moved. Run it by hand from the Actions tab after a docs
# change you don't want to wait a day for.
on:
  schedule:
    - cron: "17 4 * * *" # daily, off the hour: those minutes are stampedes
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-docs
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2

      - name: Install cwebp
        run: sudo apt-get update && sudo apt-get install -y webp

      # --ignore-scripts: `prepare` installs the prek hooks, which CI has no use for
      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Pull the guides
        run: bun run docs
        env:
          GITHUB_TOKEN: ${{ github.token }} # the API listing is rate-limited anonymously

      - name: Rebuild, so a broken guide fails here and not in production
        run: bun run build

      - name: Commit anything that moved
        run: |
          if git diff --quiet -- src/docs; then
            echo "docs unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/docs
          git commit -m "chore: refresh project docs"
          git push
